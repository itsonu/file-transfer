name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    name: Wheel & sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pip install build && python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: dist/*

  binaries:
    name: Binary (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - { os: ubuntu-latest, name: linux-x64 }
          - { os: macos-latest, name: macos-arm64 }
          - { os: windows-latest, name: windows-x64 }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python scripts/build_app.py
      - name: Package
        shell: bash
        # .tar.gz keeps the executable bit on macOS/Linux; Windows gets the .exe as-is.
        run: |
          cd dist
          if [ "$RUNNER_OS" = "Windows" ]; then
            mv open-transfer.exe "open-transfer-${{ matrix.name }}.exe"
          else
            tar -czf "open-transfer-${{ matrix.name }}.tar.gz" open-transfer && rm open-transfer
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.name }}
          path: dist/open-transfer-*

  docker:
    name: Docker image → GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/open-transfer
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  publish:
    name: GitHub release
    needs: [python, binaries]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
